name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with current Go: go1.22.0 binaries lack LC_UUID and crash on
          # recent macOS. go.mod only sets the minimum for `go install` users.
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/stremio-doctor
