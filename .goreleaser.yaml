version: 2

builds:
  # Windows and Linux are pure Go and cross-compile anywhere.
  - id: default
    main: ./cmd/stremio-doctor
    binary: stremio-doctor
    env:
      - CGO_ENABLED=0
    goos: [windows, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  # The macOS tray (fyne.io/systray) needs cgo, so darwin must be built on a
  # macOS runner; Apple clang builds both architectures.
  - id: darwin
    main: ./cmd/stremio-doctor
    binary: stremio-doctor
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
